  <path d="M166 236 A90 90 0 0 0 346 236" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="256" y1="326" x2="256" y2="372" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <line x1="196" y1="384" x2="316" y2="384" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  <!-- transcript lines inside the capsule -->
